services:
  - type: web
    name: infoconcours
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: infoconcours-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "1"
databases:
  - name: infoconcours-db
    plan: basic-256mb
