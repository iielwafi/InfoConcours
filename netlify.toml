[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Only enable the health endpoint during the migration bootstrap.
# The application-wide rewrite is intentionally added after route parity is complete.
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
